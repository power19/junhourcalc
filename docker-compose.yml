version: "3.8"

services:
  hours-app:
    build: .
    image: hours-app:latest
    container_name: junlin-hours-app
    environment:
      - VIRTUAL_HOST=uren.junlin.shop
      - VIRTUAL_PORT=3000
      - CERT_NAME=junlin.shop
      - PORT=3000
    networks:
      - frappe-install_frappe_network
    restart: unless-stopped

networks:
  frappe-install_frappe_network:
    external: true
